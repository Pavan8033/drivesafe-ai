services:
  - type: web
    name: drivesafe-ai-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000
      - key: CORS_ORIGINS
        value: "*"
      - key: DEFAULT_EAR_THRESHOLD
        value: "0.21"
      - key: PROLONGED_CLOSURE_SECONDS
        value: "1.5"
      - key: MAR_THRESHOLD
        value: "0.60"
